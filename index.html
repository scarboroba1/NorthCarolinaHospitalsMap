<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Hospitals per County in North Carolina</title>
    	<link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.0/dist/leaflet.css"/>
	    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v6.7.0/css/all.css">

<style>
    html, body, #map { width: 100%; height: 100%; margin: 0; background: #fff; }

    .legend {
    line-height: 40px;
    font-size: 16px;
    width: 190px;
    color: #333333;
    padding: 6px 8px;
    background: white;
    background: rgba(255,255,255,0.5);
    box-shadow: 0 0 15px rgba(0,0,0,0.2);
    border-radius: 5px;
    font-family: 'Titillium Web', sans-serif;
}
 
.legend i {
    width: 20px;
    height: 20px;
    float: left;
    margin-right: 8px;
    opacity: 0.9;
}
 
.legend img {
    width: 16px;
    height: 16px;
    margin-right: 3px;
    float: left;
}
 
.legend p {
    font-size: 14px;
    line-height: 20px;
    margin: 0;
}

</style>  

    <link href="https://fonts.googleapis.com/css?family=Titillium+Web" rel="stylesheet">
	<script src="https://unpkg.com/leaflet@1.7.0/dist/leaflet.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-ajax/2.1.0/leaflet.ajax.min.js"></script>
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.1.0/jquery.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/chroma-js/1.3.4/chroma.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>

</head>
<body>
	<div id="map"></div>

<script>
	//map object
var mymap = L.map('map', {
    center: [35.7596, -79.0193], //note that we've centered the map to downtown AVL
    zoom: 7, //this line adjusts the starting zoom level of the map
    maxZoom: 18,//this line sets the maximum zoom level
    minZoom: 7,//this line sets the minimum zoom level
    detectRetina: true // detect whether the screen is high resolution or not.
});

//basemap
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager_labels_under/{z}/{x}/{y}{r}.png').addTo(mymap);

//hospital data
var hospitals_NC = null;

var colors = chroma.scale('Dark2').mode('lch').colors(3);

for (i = 0; i < 3; i++) {
    $('head').append($("<style> .marker-color-" + (i + 1).toString() + " { color: " + colors[i] + "; font-size: 15px; text-shadow: 0 0 3px #ffffff;} </style>"));
}

hospitals_NC = L.geoJson.ajax("assets/NorthCarolinaHospitals.geojson", {
    pointToLayer: function (feature, latlng) {
        return L.marker(latlng, {
            icon: L.divIcon({
                className: 'fa-icon',  // you can keep this simple
                html: '<i class="fas fa-hospital marker-color-1"></i>', // choose your FA icon
                iconSize: [20, 20],
                iconAnchor: [10, 10]
            })
        });
    }
}).addTo(mymap);


L.geoJson.ajax("assets/NorthCarolinaCounties.geoJson").addTo(mymap);

function style(feature) {
    return {
        fillColor: setColor(feature.properties.total_bnbs),
        fillOpacity: 0.4,
        weight: 2,
        opacity: 1,
        color: '#b4b4b4',
        dashArray: '4'
    };
}

var legend = L.control({position: 'topright'});

legend.onAdd = function () {
        // Create Div Element and Populate it with HTML
        var div = L.DomUtil.create('div', 'legend');
    //this line creates a title for the choropleth part of the legend
    div.innerHTML += '<b>North Carolina hospitals by County</b><br />';
    //notice the class breaks entered at the end of the next 5 lines
    //the colors specify the shade of purple that we used to do the polygon shading
    //this line provides the legend title for the airbnb colored symbols
    div.innerHTML += '<hr><b>Hospital<b><br />';
    //the next 3 lines call the airbnb icon along with its proper color
    //notice the names of the Airbnb property types listed within the <p> tags at the end of the lines
    div.innerHTML += '<i class="fas fa-hospital marker-color-1"></i><p>Hospital</p>';
    return div;
};

legend.addTo(mymap);

L.control.scale({position: 'bottomleft'}).addTo(mymap);

</script>
</body>
</html>
